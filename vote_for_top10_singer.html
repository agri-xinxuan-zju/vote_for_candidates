<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农学院十佳歌手十二强投票</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #00b894 0%, #55a05a 30%, #2d5a27 70%, #1e3a1e 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            pointer-events: none;
            opacity: 0.15;
            z-index: 0;
        }

        .bg-leaf1 {
            top: 5%;
            left: -3%;
            font-size: 180px;
            animation: float 25s infinite ease-in-out;
        }

        .bg-leaf2 {
            bottom: 10%;
            right: -5%;
            font-size: 200px;
            animation: float 22s infinite ease-in-out 3s;
        }

        .bg-grass1 {
            top: 30%;
            left: 5%;
            font-size: 120px;
            animation: float 20s infinite ease-in-out 5s;
        }

        .bg-grass2 {
            bottom: 20%;
            right: 10%;
            font-size: 150px;
            animation: float 28s infinite ease-in-out 2s;
        }

        .bg-wheat {
            top: 60%;
            left: 15%;
            font-size: 130px;
            animation: float 24s infinite ease-in-out 4s;
        }

        .bg-sunflower {
            top: 15%;
            right: 15%;
            font-size: 160px;
            animation: float 26s infinite ease-in-out 6s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            50% { transform: translateY(10px) rotate(-3deg); }
            75% { transform: translateY(-15px) rotate(3deg); }
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: clamp(1rem, 3vw, 1.2rem);
            opacity: 0.95;
            margin-bottom: 15px;
        }

        .deadline {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        .rules {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .rules h3 {
            color: #2d5a27;
            margin-bottom: 12px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rules ul {
            list-style: none;
            padding-left: 20px;
        }

        .rules li {
            padding: 8px 0;
            color: #555;
            position: relative;
            font-size: 0.95rem;
        }

        .rules li::before {
            content: '🌾';
            position: absolute;
            left: -20px;
        }

        .poll-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .vote-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 18px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 10px;
        }

        .vote-count {
            color: #2d5a27;
            font-weight: bold;
            font-size: 1.5rem;
            display: block;
            margin-bottom: 8px;
        }

        .vote-status {
            color: #558b2f;
            font-size: 0.95rem;
            display: block;
        }

        /* 视频弹窗样式 */
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
        }

        .video-modal-content {
            position: relative;
            width: 90%;
            max-width: 640px;
            background: #1a3a1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .video-close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .video-close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .video-player-container {
            width: 100%;
            background: #000;
        }

        .video-player-container video {
            width: 100%;
            max-height: 70vh;
            display: block;
        }

        .video-info {
            padding: 20px;
            text-align: center;
        }

        .video-info h3 {
            color: #fff;
            margin: 0 0 8px 0;
            font-size: 1.3rem;
        }

        .video-info p {
            color: #a8e6cf;
            margin: 0;
            font-size: 1rem;
        }

        .contestants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .contestant-card {
            background: linear-gradient(145deg, #f8faf8 0%, #e8f5e9 100%);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-align: center;
        }

        .contestant-card:hover:not(.disabled) {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,184,148,0.2);
            border-color: #00b894;
        }

        .contestant-card.selected {
            background: linear-gradient(145deg, #e8f5e9 0%, #c8e6c9 100%);
            border-color: #2d5a27;
        }

        .contestant-card.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .contestant-avatar {
            width: clamp(60px, 18vw, 75px);
            height: clamp(60px, 18vw, 75px);
            border-radius: 50%;
            background: linear-gradient(135deg, #00b894 0%, #2d5a27 100%);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            font-weight: bold;
        }

        .contestant-name {
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            font-weight: bold;
            color: #2d5a27;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contestant-song {
            font-size: clamp(0.75rem, 2.5vw, 0.85rem);
            color: #66bb6a;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contestant-number {
            display: inline-block;
            background: linear-gradient(135deg, #00b894 0%, #2d5a27 100%);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: clamp(0.7rem, 2vw, 0.8rem);
            font-weight: bold;
        }

        .contestant-video-btn {
            font-size: 0.8rem;
            color: #7bed9f;
            margin-top: 8px;
            padding: 6px 12px;
            background: rgba(123, 237, 159, 0.2);
            border-radius: 15px;
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(123, 237, 159, 0.3);
        }

        .contestant-video-btn:hover {
            background: rgba(123, 237, 159, 0.4);
            transform: scale(1.05);
        }

        .contestant-card.disabled .contestant-video-btn {
            opacity: 1; /* 视频按钮始终可见可点击 */
            pointer-events: auto;
        }

        .vote-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00b894 0%, #2d5a27 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0,184,148,0.3);
        }

        .vote-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,184,148,0.4);
        }

        .vote-btn:disabled {
            background: #a5d6a7;
            cursor: not-allowed;
        }

        .results {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e8f5e9;
        }

        .results h3 {
            font-size: 1.3rem;
            color: #2d5a27;
            margin-bottom: 18px;
            text-align: center;
        }

        .result-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 12px 15px;
            background: #f8faf8;
            border-radius: 10px;
        }

        .result-rank {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00b894 0%, #2d5a27 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            font-size: 0.9rem;
        }

        .result-rank.top3 {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
        }

        .result-info {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-name {
            font-weight: bold;
            color: #2d5a27;
            text-align: center;
        }

        .result-bar-container {
            flex: 2;
            margin-left: 15px;
        }

        .result-bar {
            height: 22px;
            background: #e8f5e9;
            border-radius: 11px;
            overflow: hidden;
        }

        .result-fill {
            height: 100%;
            background: linear-gradient(90deg, #00b894 0%, #2d5a27 100%);
            border-radius: 11px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }

        .result-fill span {
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #f8faf8 0%, #e8f5e9 100%);
            border-radius: 12px;
        }
        
        .sync-status {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            font-size: 0.85rem;
            color: #666;
        }
        
        .sync-status.online {
            color: #2e7d32;
        }
        
        .sync-status.offline {
            color: #c62828;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2d5a27;
        }

        .stat-label {
            font-size: 0.95rem;
            color: #558b2f;
            margin-top: 5px;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .remaining-time {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 1rem;
            opacity: 0.95;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .contestants-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }

            .contestant-card {
                padding: 15px 10px;
            }

            .contestant-name {
                font-size: clamp(0.85rem, 4vw, 1rem);
                min-height: 1.4em;
            }

            .contestant-song {
                font-size: clamp(0.7rem, 3vw, 0.8rem);
                min-height: 1.4em;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }

            .result-item {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .result-bar-container {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰元素 -->
    <div class="bg-decoration bg-leaf1">🍃</div>
    <div class="bg-decoration bg-leaf2">🌿</div>
    <div class="bg-decoration bg-grass1">🌱</div>
    <div class="bg-decoration bg-grass2">☘️</div>
    <div class="bg-decoration bg-wheat">🌾</div>
    <div class="bg-decoration bg-sunflower">🌻</div>

    <div class="container">
        <div class="header">
            <h1>🌾 农学院十佳歌手 🌾</h1>
            <p>初赛18进12投票通道</p>
            <div class="deadline">投票时间：2026年5月12日21:00 - 5月17日18:00</div>
        </div>

        <div class="rules">
            <h3>📋 投票规则</h3>
            <ul>
                <li>每天可投最多 <strong>三票</strong></li>
                <li>每天只能投票 <strong>一次</strong></li>
            </ul>
        </div>

        <div class="poll-card">
            <div class="vote-info">
                <span class="vote-count" id="selectedCount">0</span> / 3 票已选择
                <span class="vote-status" id="voteStatus">今日剩余投票机会：1次</span>
            </div>

            <!-- 视频弹窗 -->
            <div class="video-modal" id="videoModal" style="display: none;">
                <div class="video-modal-overlay" onclick="closeVideoModal()"></div>
                <div class="video-modal-content">
                    <button class="video-close-btn" onclick="closeVideoModal()">×</button>
                    <div class="video-player-container">
                        <video id="player" controls poster="">
                            <source id="videoSource" src="" type="video/mp4">
                        </video>
                    </div>
                    <div class="video-info">
                        <h3 id="videoContestantName"></h3>
                        <p id="videoSongName"></p>
                    </div>
                </div>
            </div>

            <div class="contestants-grid" id="contestants">
                <!-- 选手卡片 -->
            </div>

            <button class="vote-btn" id="voteBtn" onclick="submitVote()">提交投票</button>

            <div class="results">
                <h3>📊 实时投票排名</h3>
                <div id="resultsList"></div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalVotes">0</div>
                    <div class="stat-label">总票数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalVoters">0</div>
                    <div class="stat-label">参与人数</div>
                </div>
            </div>
            
            <div style="text-align:center;margin-top:15px;">
                <button onclick="manualRefresh()" style="padding:8px 16px;background:#2196F3;color:white;border:none;border-radius:4px;cursor:pointer;margin-right:10px;">
                    🔄 手动刷新数据
                </button>
                <button onclick="initTestData()" style="padding:8px 16px;background:#FF9800;color:white;border:none;border-radius:4px;cursor:pointer;">
                    🧪 初始化测试数据
                </button>
            </div>
            
            <div class="sync-status" id="syncStatus">
                <span id="syncIcon">🔄</span> <span id="syncText">正在连接云端...</span>
            </div>
        </div>

        <div class="remaining-time" id="remainingTime"></div>
    </div>

    <script>
        // 是否启用云端同步
        const ENABLE_CLOUD_SYNC = true; // 设置为 true 启用云端同步
        let db = null;
        let firebaseInitialized = false;

        // 如果启用云端同步，加载 Firebase SDK（使用兼容版本 8.x）
        if (ENABLE_CLOUD_SYNC) {
            const script1 = document.createElement('script');
            script1.src = 'https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js';
            script1.onload = loadFirebaseDatabase;
            script1.onerror = () => {
                console.error('❌ Firebase App SDK 加载失败');
                showMessage('error', '数据同步服务加载失败，请刷新页面重试');
            };
            document.head.appendChild(script1);
        }

        function loadFirebaseDatabase() {
            const script2 = document.createElement('script');
            script2.src = 'https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js';
            script2.onload = initFirebase;
            script2.onerror = () => {
                console.error('❌ Firebase Database SDK 加载失败');
                showMessage('error', '数据同步服务加载失败，请刷新页面重试');
            };
            document.head.appendChild(script2);
        }

        function initFirebase() {
            // ⚠️ 请替换为你的 Firebase 配置信息
            const firebaseConfig = {
                apiKey: "AIzaSyDKwD96gPVTZKAEyD_yJXRWVggNMpTWVF8",
                authDomain: "vote-for-candidates.firebaseapp.com",
                databaseURL: "https://vote-for-candidates-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "vote-for-candidates",
                storageBucket: "vote-for-candidates.firebasestorage.app",
                messagingSenderId: "600898694792",
                appId: "1:600898694792:web:ce385f05086bccc527b93d"
            };
            try {
                if (!firebase.apps.length) {
                    const app = firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
                firebaseInitialized = true;
                console.log('✅ Firebase 初始化成功');
                
                // 显示在线状态
                updateSyncStatus(true, '云端连接成功，数据实时同步中');
                
                // 监听连接状态
                db.ref('.info/connected').on('value', snapshot => {
                    const connected = snapshot.val();
                    if (connected) {
                        updateSyncStatus(true, '云端连接成功，数据实时同步中');
                        console.log('✅ Firebase 已连接');
                    } else {
                        updateSyncStatus(false, '云端连接断开，正在重连...');
                        console.log('⚠️ Firebase 连接断开');
                    }
                });
                
                // Firebase 初始化完成后，重新加载数据并设置监听器
                loadVotesFromCloud();
                setupFirebaseListeners();
            } catch (error) {
                console.error('❌ Firebase 初始化失败:', error);
                updateSyncStatus(false, '数据同步服务初始化失败');
                showMessage('error', '数据同步服务初始化失败，请刷新页面重试');
            }
        }
        
        // 更新同步状态显示
        function updateSyncStatus(isOnline, text) {
            const statusEl = document.getElementById('syncStatus');
            const iconEl = document.getElementById('syncIcon');
            const textEl = document.getElementById('syncText');
            
            if (!statusEl) return;
            
            statusEl.className = 'sync-status ' + (isOnline ? 'online' : 'offline');
            iconEl.textContent = isOnline ? '✅' : '⚠️';
            textEl.textContent = text;
        }

        // 设置 Firebase 实时监听器
        function setupFirebaseListeners() {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) return;
            
            try {
                // 监听票数变化
                db.ref('votes').on('value', (snapshot) => {
                    console.log('📡 收到票数更新');
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        contestants.forEach(c => {
                            c.votes = data[c.id] || 0;
                        });
                        updateResults();
                        updateStats();
                    }
                }, (error) => {
                    console.error('❌ 监听票数变化失败:', error);
                });
                
                // 监听投票人数变化
                db.ref('totalVoters').on('value', (snapshot) => {
                    console.log('📡 收到投票人数更新');
                    if (snapshot.exists()) {
                        totalVoters = snapshot.val();
                        updateStats();
                    }
                }, (error) => {
                    console.error('❌ 监听投票人数变化失败:', error);
                });
            } catch (error) {
                console.error('❌ 设置监听器失败:', error);
            }
        }

        // 十八强选手数据（添加视频链接）
        const contestants = [
            { id: 1, name: '陈香凝', song: '《喜欢你》', votes: 0, video: 'https://videos-top10-singer-1432423219.cos.ap-guangzhou.myqcloud.com/%E9%99%88%E9%A6%99%E5%87%9D.mp4' },
            { id: 2, name: '宋靖宇', song: '《第一天》', votes: 0, video: 'https://videos-top10-singer-1432423219.cos.ap-guangzhou.myqcloud.com/%E5%AE%8B%E9%9D%96%E5%AE%87.mp4' },

            { id: 4, name: '罗元楠', song: '《旅行中忘记》', votes: 0, video: 'https://videos-top10-singer-1432423219.cos.ap-guangzhou.myqcloud.com/%E7%BD%97%E5%85%83%E6%A5%A0.mp4' },

            { id: 17, name: '么紫瑶', song: '《知己》', votes: 0, video: 'https://videos-top10-singer-1432423219.cos.ap-guangzhou.myqcloud.com/%E4%B9%88%E7%B4%AB%E7%91%B6.mp4' },
            { id: 18, name: '项俊豪', song: '《想见你想见你想见你》', votes: 0, video: 'https://videos-top10-singer-1432423219.cos.ap-guangzhou.myqcloud.com/%E9%A1%B9%E4%BF%8A%E8%B1%AA.mp4' }
        ];

        // 投票开始时间：2026年5月12日21点
        const VOTE_START_TIME = new Date('2026-05-12T21:00:00').getTime();
        const STORAGE_KEY_VOTE_STARTED = 'vote_started_20260512';

        const STORAGE_KEY_VOTED = 'singer_vote_date';
        const STORAGE_KEY_SELECTED = 'singer_vote_selected';
        const STORAGE_KEY_TOTAL_VOTERS = 'singer_total_voters';

        let selectedIds = [];
        let hasVotedToday = false;
        let totalVoters = parseInt(localStorage.getItem(STORAGE_KEY_TOTAL_VOTERS)) || 0;

        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        // 检查投票是否已开始（兼容微信浏览器）
        function isVoteStarted() {
            try {
                const now = Date.now ? Date.now() : new Date().getTime();
                return now >= VOTE_START_TIME;
            } catch (e) {
                // 微信浏览器可能存在时间兼容性问题
                const now = new Date();
                const startTime = new Date('2026-05-12T12:00:00');
                return now >= startTime;
            }
        }

        // 打开视频弹窗
        function openVideoModal(contestant) {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('player');
            const source = document.getElementById('videoSource');
            
            // 设置视频源
            source.src = contestant.video;
            player.load();
            
            // 设置选手信息
            document.getElementById('videoContestantName').textContent = contestant.name;
            document.getElementById('videoSongName').textContent = contestant.song;
            
            // 显示弹窗
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        // 关闭视频弹窗
        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('player');
            
            // 暂停视频
            player.pause();
            
            // 隐藏弹窗
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }

        // 从云端加载投票数据
        async function loadVotesFromCloud() {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) {
                console.log('⚠️ Firebase 未就绪，跳过加载云端数据');
                return;
            }
            try {
                console.log('📥 开始从云端加载数据...');
                updateSyncStatus(true, '正在加载数据...');
                
                const snapshot = await db.ref('votes').once('value');
                console.log('📥 votes snapshot:', snapshot.val());
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    contestants.forEach(c => {
                        c.votes = data[c.id] || 0;
                    });
                    console.log('✅ 票数数据加载成功:', contestants.map(c => ({id: c.id, name: c.name, votes: c.votes})));
                } else {
                    console.log('ℹ️ 云端暂无票数数据，初始化全为0');
                    contestants.forEach(c => c.votes = 0);
                }
                
                const votersSnapshot = await db.ref('totalVoters').once('value');
                totalVoters = votersSnapshot.exists() ? votersSnapshot.val() : 0;
                console.log('✅ 投票人数加载成功:', totalVoters);
                
                updateResults();
                updateStats();
                updateSyncStatus(true, '数据加载完成，实时同步中');
            } catch (error) {
                console.error('❌ 加载云端数据失败:', error);
                updateSyncStatus(false, '数据加载失败: ' + error.message);
                showMessage('error', '加载数据失败: ' + error.message);
            }
        }

        // 手动刷新数据
        function manualRefresh() {
            console.log('🔄 用户手动刷新数据');
            showMessage('info', '正在刷新数据...');
            if (firebaseInitialized && db) {
                loadVotesFromCloud();
            } else {
                showMessage('error', '云端未连接，请稍后重试');
            }
        }
        
        // 初始化测试数据（仅用于测试）
        async function initTestData() {
            if (!firebaseInitialized || !db) {
                showMessage('error', '云端未连接');
                return;
            }
            
            if (!confirm('确定要初始化测试数据吗？这会将所有票数重置为测试值。')) {
                return;
            }
            
            try {
                console.log('🧪 开始初始化测试数据...');
                const testData = {};
                contestants.forEach(c => {
                    testData[c.id] = Math.floor(Math.random() * 50);
                });
                
                await db.ref('votes').set(testData);
                await db.ref('totalVoters').set(Math.floor(Math.random() * 20) + 5);
                
                console.log('✅ 测试数据初始化成功:', testData);
                showMessage('success', '测试数据初始化成功！');
                loadVotesFromCloud();
            } catch (error) {
                console.error('❌ 初始化测试数据失败:', error);
                showMessage('error', '初始化失败: ' + error.message);
            }
        }
        
        // 保存投票到云端 - 使用事务安全累加
        async function saveVotesToCloud(votedIds, increaseVoters) {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) {
                console.log('⚠️ Firebase 未就绪，跳过保存云端数据');
                return;
            }
            try {
                console.log('📤 开始保存投票到云端，投票选手:', votedIds);
                
                // 1. 为每个选中的选手使用事务累加票数
                for (const id of votedIds) {
                    console.log('📍 正在为选手', id, '增加票数');
                    await db.ref('votes/' + id).transaction(currentVotes => {
                        const newVotes = (currentVotes || 0) + 1;
                        console.log('📍 选手', id, '票数从', currentVotes, '更新为', newVotes);
                        return newVotes;
                    });
                }
                
                // 2. 如果需要，使用事务累加投票人数
                if (increaseVoters) {
                    console.log('📍 正在增加投票人数');
                    await db.ref('totalVoters').transaction(currentVoters => {
                        const newCount = (currentVoters || 0) + 1;
                        console.log('📍 投票人数从', currentVoters, '更新为', newCount);
                        return newCount;
                    });
                }
                
                console.log('✅ 数据保存到云端成功');
                showMessage('success', '投票已同步到云端！');
            } catch (error) {
                console.error('❌ 保存数据到云端失败:', error);
                showMessage('error', '数据同步失败，但投票已提交');
            }
        }

        // 重置投票数据 - 已禁用，避免清空云端数据
        function resetVotesIfNeeded() {
            // ⚠️ 此功能已禁用，不再自动重置投票数据
            // 所有数据以云端 Firebase 为准
            console.log('ℹ️ 投票数据从云端同步，不进行本地重置');
            return;
        }

        function checkVoteStatus() {
            // 检查投票是否开始
            if (!isVoteStarted()) {
                document.getElementById('voteStatus').textContent = '投票尚未开始，请等待5月12日21:00';
                document.getElementById('voteStatus').style.color = '#ff9800';
                document.getElementById('voteBtn').disabled = true;
                document.querySelectorAll('.contestant-card').forEach(card => {
                    card.classList.add('disabled');
                });
                return;
            }

            const lastVoteDate = localStorage.getItem(STORAGE_KEY_VOTED);
            const today = getTodayString();
            
            if (lastVoteDate === today) {
                hasVotedToday = true;
                document.getElementById('voteStatus').textContent = '今日已投票，明天再来！';
                document.getElementById('voteStatus').style.color = '#c62828';
                document.getElementById('voteBtn').disabled = true;
                
                const votedIds = JSON.parse(localStorage.getItem(STORAGE_KEY_SELECTED) || '[]');
                selectedIds = votedIds;
                updateSelectedDisplay();
                highlightVotedContestants(votedIds);
            }
        }

        function renderContestants() {
            const container = document.getElementById('contestants');
            container.innerHTML = '';
            const voteNotStarted = !isVoteStarted();
            
            contestants.forEach(contestant => {
                const card = document.createElement('div');
                card.className = 'contestant-card';
                card.dataset.id = contestant.id;
                
                // 投票未开始或已投票，禁用卡片
                if (hasVotedToday || voteNotStarted) card.classList.add('disabled');
                
                card.innerHTML = `
                    <div class="contestant-avatar">${contestant.id}</div>
                    <div class="contestant-name">${contestant.name}</div>
                    <div class="contestant-song">${contestant.song || '待定'}</div>
                    <div class="contestant-number">选手 ${contestant.id} 号</div>
                    <div class="contestant-video-btn" data-id="${contestant.id}">▶ 观看视频</div>
                `;
                
                // 投票进行中且未投票，绑定卡片点击选择
                if (!hasVotedToday && !voteNotStarted) {
                    card.addEventListener('click', (e) => {
                        // 如果点击的是视频按钮，不触发选择
                        if (!e.target.classList.contains('contestant-video-btn')) {
                            toggleContestant(contestant.id);
                        }
                    });
                }
                
                // 视频按钮始终可以点击
                card.querySelector('.contestant-video-btn').addEventListener('click', () => {
                    openVideoModal(contestant);
                });
                
                container.appendChild(card);
            });
        }

        function toggleContestant(id) {
            // 投票未开始或已投票，禁止选择
            if (hasVotedToday || !isVoteStarted()) return;
            
            const index = selectedIds.indexOf(id);
            if (index > -1) {
                selectedIds.splice(index, 1);
            } else if (selectedIds.length < 3) {
                selectedIds.push(id);
            } else {
                showMessage('error', '最多只能选择3位选手！');
            }
            
            updateSelectedDisplay();
            updateCardStyles();
        }

        function updateSelectedDisplay() {
            document.getElementById('selectedCount').textContent = selectedIds.length;
            // 投票未开始、已投票或未选择选手，禁用按钮
            document.getElementById('voteBtn').disabled = selectedIds.length === 0 || hasVotedToday || !isVoteStarted();
        }

        function updateCardStyles() {
            document.querySelectorAll('.contestant-card').forEach(card => {
                const id = parseInt(card.dataset.id);
                card.classList.toggle('selected', selectedIds.includes(id));
            });
        }

        function highlightVotedContestants(votedIds) {
            document.querySelectorAll('.contestant-card').forEach(card => {
                const id = parseInt(card.dataset.id);
                if (votedIds.includes(id)) card.classList.add('selected');
            });
        }

        async function submitVote() {
            if (selectedIds.length === 0) {
                showMessage('error', '请先选择要投票的选手！');
                return;
            }
            
            const voteBtn = document.getElementById('voteBtn');
            voteBtn.disabled = true;
            voteBtn.textContent = '提交中...';
            
            try {
                // 先检查是否需要增加投票人数
                const increaseVoters = !localStorage.getItem(STORAGE_KEY_VOTED + '_counted');
                
                // 保存投票状态到本地，防止重复投票
                localStorage.setItem(STORAGE_KEY_VOTED, getTodayString());
                localStorage.setItem(STORAGE_KEY_SELECTED, JSON.stringify(selectedIds));
                
                if (increaseVoters) {
                    localStorage.setItem(STORAGE_KEY_VOTED + '_counted', 'true');
                }
                
                // 使用事务保存到云端
                await saveVotesToCloud(selectedIds, increaseVoters);
                
                // 更新本地状态
                hasVotedToday = true;
                document.getElementById('voteStatus').textContent = '今日已投票，明天再来！';
                document.getElementById('voteStatus').style.color = '#c62828';
                voteBtn.textContent = '提交投票';
                
                // 更新已投票选手的高亮状态
                highlightVotedContestants(selectedIds);
                
                showMessage('success', `🎉 投票成功！数据正在同步中...`);
                
            } catch (error) {
                console.error('❌ 投票失败:', error);
                showMessage('error', '投票失败，请重试');
                voteBtn.disabled = false;
                voteBtn.textContent = '提交投票';
            }
        }

        function updateResults() {
            const sorted = [...contestants].sort((a, b) => b.votes - a.votes);
            const container = document.getElementById('resultsList');
            container.innerHTML = '';
            
            const totalVotes = contestants.reduce((sum, c) => sum + c.votes, 0);
            
            sorted.forEach((contestant, index) => {
                const percent = totalVotes > 0 ? Math.round((contestant.votes / totalVotes) * 100) : 0;
                
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <div class="result-rank ${index < 3 ? 'top3' : ''}">${index + 1}</div>
                    <div class="result-info">
                        <div class="result-name">${contestant.name}</div>
                    </div>
                    <div class="result-bar-container">
                        <div class="result-bar">
                            <div class="result-fill" style="width: ${percent}%">
                                <span>${contestant.votes}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(item);
            });
        }

        function updateStats() {
            const totalVotes = contestants.reduce((sum, c) => sum + c.votes, 0);
            
            document.getElementById('totalVotes').textContent = totalVotes;
            document.getElementById('totalVoters').textContent = totalVoters;
        }

        // 手动刷新数据
        function manualRefresh() {
            console.log('🔄 用户手动刷新数据');
            showMessage('info', '正在刷新数据...');
            if (firebaseInitialized && db) {
                loadVotesFromCloud();
            } else {
                showMessage('error', '云端未连接，请稍后重试');
            }
        }

        function showMessage(type, text) {
            const existing = document.querySelector('.message');
            if (existing) existing.remove();
            
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            
            const pollCard = document.querySelector('.poll-card');
            pollCard.insertBefore(message, pollCard.firstChild);
            
            setTimeout(() => message.remove(), 3000);
        }

        function updateRemainingTime() {
            const deadline = new Date('2026-05-17T18:00:00');
            const now = new Date();
            const diff = deadline - now;
            
            if (diff <= 0) {
                document.getElementById('remainingTime').textContent = '投票已截止';
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('remainingTime').textContent = 
                `⏰ 距离投票截止还剩：${days}天 ${hours}小时 ${minutes}分钟 ${seconds}秒`;
        }

        function init() {
            console.log('🚀 应用初始化...');
            
            // 防止微信浏览器缓存，自动添加时间戳
            if (window.location.search.indexOf('t=') === -1) {
                const newUrl = window.location.pathname + '?t=' + Date.now() + window.location.hash;
                console.log('🔄 自动添加时间戳防止缓存，重定向中...');
                window.location.replace(newUrl);
                return;
            }
            
            // 显示加载状态
            document.getElementById('totalVotes').textContent = '加载中...';
            document.getElementById('totalVoters').textContent = '加载中...';
            document.getElementById('resultsList').innerHTML = '<div style="text-align:center;color:#888;padding:20px;">正在加载投票数据...</div>';
            
            // 检查投票状态和渲染界面
            checkVoteStatus();
            renderContestants();
            updateRemainingTime();
            setInterval(updateRemainingTime, 1000);
            
            console.log('✅ 页面初始化完成，等待 Firebase 连接...');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
