<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农学院十佳歌手初赛18进12投票</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a4d2e 0%, #2d5a27 50%, #00b894 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 漂浮农业元素 */
        .floating-element {
            position: fixed;
            font-size: 40px;
            opacity: 0.15;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }

        .floating-element:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .floating-element:nth-child(2) { top: 20%; right: 10%; animation-delay: 1s; }
        .floating-element:nth-child(3) { top: 35%; left: 15%; animation-delay: 2s; }
        .floating-element:nth-child(4) { top: 50%; right: 5%; animation-delay: 3s; }
        .floating-element:nth-child(5) { top: 65%; left: 8%; animation-delay: 4s; }
        .floating-element:nth-child(6) { top: 80%; right: 15%; animation-delay: 5s; }
        .floating-element:nth-child(7) { top: 90%; left: 20%; animation-delay: 6s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        h1 {
            text-align: center;
            color: #2d5a27;
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #00b894;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            margin-bottom: 20px;
        }

        .vote-status {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: clamp(0.9rem, 3vw, 1rem);
        }

        .vote-status span {
            font-weight: bold;
            color: #2d5a27;
        }

        .contestants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .contestant-card {
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .contestant-card:hover:not(.disabled) {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.3);
        }

        .contestant-card.selected {
            border-color: #00b894;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        }

        .contestant-card.disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .contestant-avatar {
            width: 50px;
            height: 50px;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, #00b894 0%, #2d5a27 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .contestant-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            font-size: clamp(0.85rem, 3vw, 0.95rem);
        }

        .contestant-song {
            color: #666;
            font-size: clamp(0.75rem, 2.5vw, 0.85rem);
            margin-bottom: 8px;
        }

        .contestant-number {
            font-size: 0.7rem;
            color: #999;
            margin-bottom: 8px;
        }

        .contestant-video-btn {
            font-size: 0.8rem;
            color: #7bed9f;
            margin-top: 8px;
            padding: 8px 16px;
            background: rgba(123, 237, 159, 0.2);
            border-radius: 15px;
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(123, 237, 159, 0.3);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            min-width: 80px;
        }

        .contestant-video-btn:hover {
            background: rgba(123, 237, 159, 0.4);
            transform: scale(1.05);
        }

        .contestant-video-btn:active {
            transform: scale(0.95);
            background: rgba(123, 237, 159, 0.5);
        }

        .contestant-card.disabled .contestant-video-btn {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 600px) {
            .contestant-video-btn {
                font-size: clamp(0.75rem, 3.5vw, 0.9rem);
                padding: 10px 20px;
                min-width: 100px;
            }
        }

        .vote-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00b894 0%, #2d5a27 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 25px;
        }

        .vote-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 184, 148, 0.4);
        }

        .vote-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .results {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .results h3 {
            color: #2d5a27;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .results-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .result-item:hover {
            background: #f0fff4;
        }

        .result-item.top3 {
            background: linear-gradient(135deg, #fff9c4 0%, #fff59d 100%);
        }

        .result-info {
            display: flex;
            align-items: center;
            text-align: center;
        }

        .result-rank {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            margin-right: 12px;
        }

        .result-rank.gold { background: #ffd700; color: #8b6914; }
        .result-rank.silver { background: #c0c0c0; color: #4a4a4a; }
        .result-rank.bronze { background: #cd7f32; color: #5c3317; }

        .result-name {
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        .result-votes {
            font-weight: bold;
            color: #00b894;
            font-size: 1.1rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2d5a27;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .remaining-time {
            text-align: center;
            padding: 15px;
            background: rgba(45, 90, 39, 0.1);
            border-radius: 10px;
            color: #2d5a27;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .sync-status {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideDown 0.3s ease;
        }

        .message.success { background: #00b894; }
        .message.error { background: #e74c3c; }
        .message.info { background: #3498db; }

        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .video-modal-content {
            background: white;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .video-modal-header {
            padding: 15px 20px;
            background: linear-gradient(135deg, #00b894 0%, #2d5a27 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-modal-header h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .video-close {
            cursor: pointer;
            font-size: 1.5rem;
            line-height: 1;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }

        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .video-loading,
        .video-error {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .video-info {
            padding: 15px 20px;
            text-align: center;
        }

        .video-info h3 {
            color: #2d5a27;
            margin-bottom: 5px;
        }

        .video-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .video-retry-btn {
            padding: 10px 25px;
            background: #00b894;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
                border-radius: 15px;
            }

            .contestants-grid {
                gap: 10px;
            }

            .stats {
                gap: 25px;
            }

            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- 漂浮农业元素 -->
    <div class="floating-element">🌾</div>

    <div class="container">

        <div style="text-align:center;margin-top:15px;">

                🔄 手动刷新数据
            </button>
        </div>

        <div class="sync-status" id="syncStatus">
            <span id="syncIcon">🔄</span> <span id="syncText">本地模式</span>
        </div>
    </div>

    <div class="remaining-time" id="remainingTime"></div>

    <script>
        const ENABLE_CLOUD_SYNC = true;
        let db = null;
        let firebaseInitialized = false;
        let currentContestant = null;

        // 加载 Firebase SDK
        if (ENABLE_CLOUD_SYNC) {
            const script1 = document.createElement('script');
            script1.src = 'https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js';
            script1.onload = loadFirebaseDatabase;
            script1.onerror = () => {
                console.error('Firebase SDK 加载失败');
            };
            document.head.appendChild(script1);
        }

        function loadFirebaseDatabase() {
            const script2 = document.createElement('script');
            script2.src = 'https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js';
            script2.onload = initFirebase;
            script2.onerror = () => {
                console.error('Firebase Database SDK 加载失败');
            };
            document.head.appendChild(script2);
        }

        function initFirebase() {
            const firebaseConfig = {
                apiKey: "AIzaSyDKwD96gPVTZKAEyD_yJXRWVggNMpTWVF8",
                authDomain: "vote-for-candidates.firebaseapp.com",
                databaseURL: "https://vote-for-candidates-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "vote-for-candidates",
                storageBucket: "vote-for-candidates.appspot.com",
                messagingSenderId: "600898694792",
                appId: "1:600898694792:web:ce385f05086bccc527b93d"
            };

            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                firebaseInitialized = true;
                updateSyncStatus(true, '云端连接成功');
                loadVotesFromCloud();
                setupFirebaseListeners();
            } catch (error) {
                console.error('Firebase 初始化失败:', error);
                updateSyncStatus(false, '数据同步服务初始化失败');
            }
        }

        function updateSyncStatus(isOnline, text) {
            const statusEl = document.getElementById('syncStatus');
            const iconEl = document.getElementById('syncIcon');
            const textEl = document.getElementById('syncText');
            if (!statusEl) return;
            iconEl.textContent = isOnline ? '✅' : '⚠️';
            textEl.textContent = text;
        }

        function setupFirebaseListeners() {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) return;
            try {
                db.ref('votes').on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        contestants.forEach(c => {
                            c.votes = data[c.id] || 0;
                        });
                        updateResults();
                        updateStats();
                    }
                });
                db.ref('totalVoters').on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        totalVoters = snapshot.val();
                        updateStats();
                    }
                });
            } catch (error) {
                console.error('设置监听器失败:', error);
            }
        }

        async function loadVotesFromCloud() {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) return;
            try {
                const snapshot = await db.ref('votes').once('value');
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    contestants.forEach(c => {
                        c.votes = data[c.id] || 0;
                    });
                }
                const votersSnapshot = await db.ref('totalVoters').once('value');
                totalVoters = votersSnapshot.exists() ? votersSnapshot.val() : 0;
                updateResults();
                updateStats();
            } catch (error) {
                console.error('加载云端数据失败:', error);
            }
        }

        async function saveVotesToCloud(votedIds, increaseVoters) {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) return;
            try {
                const userId = getUserIdentifier();
                
                // 记录用户投票状态，防止重复投票
                await db.ref('votedUsers/' + userId).set(getTodayString());
                
                // 如果是首次投票，记录到首次投票列表
                if (increaseVoters) {
                    await db.ref('firstTimeVoters/' + userId).set(true);
                }
                
                // 更新票数
                for (const id of votedIds) {
                    await db.ref('votes/' + id).transaction(currentVotes => {
                        return (currentVotes || 0) + 1;
                    });
                }
                
                // 更新参与人数
                if (increaseVoters) {
                    await db.ref('totalVoters').transaction(currentVoters => {
                        return (currentVoters || 0) + 1;
                    });
                }
                
                console.log('投票保存到云端成功');
            } catch (error) {
                console.error('保存到云端失败:', error);
            }
        }

        const contestants = [
            { id: 1, name: '陈香凝', song: '《喜欢你》', votes: 0, video: 'https://b23.tv/oCGEFzr' },
            { id: 2, name: '宋靖宇', song: '《第一天》', votes: 0, video: 'https://b23.tv/Hjcnye7' },
            { id: 3, name: '封墨', song: '《苦瓜》', votes: 0, video: 'https://b23.tv/DaqAhQM' },
            { id: 4, name: '罗元楠', song: '《旅行中忘记》', votes: 0, video: 'https://b23.tv/qHTDEup' },
            { id: 5, name: '朱柯宇', song: '《让我留在你身边》', votes: 0, video: 'https://b23.tv/WjjpzTy' },
            { id: 6, name: '周琳涵', song: '《City of Stars》', votes: 0, video: 'https://b23.tv/csGekEu' },
            { id: 7, name: '鲍星池', song: '《人间共鸣》', votes: 0, video: 'https://b23.tv/e4AoCIG' },
            { id: 8, name: '刘浩杰', song: '《萱草花》', votes: 0, video: 'https://b23.tv/AFuhV7u' },
            { id: 9, name: '张园彬', song: '《青火》', votes: 0, video: 'https://b23.tv/KCrgC75' },
            { id: 10, name: '胡云帆', song: '《单车》', votes: 0, video: 'https://b23.tv/yLcyWG0' },
            { id: 11, name: '王玉琛', song: '《年少有为》', votes: 0, video: 'https://b23.tv/kMspSuJ' },
            { id: 12, name: '李沛远', song: '《斑马斑马》', votes: 0, video: 'https://b23.tv/RyZZFUf' },
            { id: 13, name: '单自翔', song: '《杀死那个石家庄人》', votes: 0, video: 'https://b23.tv/z0xQV7a' },
            { id: 14, name: '赵盼', song: '《心愿便利贴》', votes: 0, video: 'https://b23.tv/n1bK8Xm' },
            { id: 15, name: '操越', song: '《不为谁而作的歌》', votes: 0, video: 'https://b23.tv/p2cR9Yt' },
            { id: 16, name: '林庆娟', song: '《麓海为王》', votes: 0, video: 'https://b23.tv/q3dS0Zu' },
            { id: 17, name: '么紫瑶', song: '《知己》', votes: 0, video: 'https://b23.tv/r4eT1Av' },
            { id: 18, name: '项俊豪', song: '《想见你想见你想见你》', votes: 0, video: 'https://b23.tv/s5fU2Bw' },
        ];

        const VOTE_START_TIME = new Date('2026-05-12T21:00:00').getTime();
        const STORAGE_KEY_VOTED = 'singer_vote_date';
        const STORAGE_KEY_SELECTED = 'singer_vote_selected';
        const STORAGE_KEY_TOTAL_VOTERS = 'singer_total_voters';
        const STORAGE_KEY_VOTES = 'singer_votes';

        let selectedIds = [];
        let hasVotedToday = false;
        let totalVoters = parseInt(localStorage.getItem(STORAGE_KEY_TOTAL_VOTERS)) || 0;

        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        function isVoteStarted() {
            try {
                return Date.now() >= VOTE_START_TIME;
            } catch (e) {
                return new Date() >= new Date('2026-05-12T12:00:00');
            }
        }

        // 生成稳定的浏览器指纹标识
        function getUserIdentifier() {
            let userId = localStorage.getItem('singer_vote_user_id');
            if (userId) {
                return userId;
            }
            
            const fingerprint = generateBrowserFingerprint();
            localStorage.setItem('singer_vote_user_id', fingerprint);
            return fingerprint;
        }
        
        function generateBrowserFingerprint() {
            const components = [
                navigator.userAgent,
                navigator.language,
                navigator.platform,
                screen.width + 'x' + screen.height,
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || 'unknown',
                navigator.maxTouchPoints || '0'
            ];
            
            let hash = 0;
            const str = components.join('|');
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            
            return 'fingerprint_' + Math.abs(hash).toString(36);
        }

        // 检查用户今天是否已在云端投票
        async function checkUserVotedToday() {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) {
                const lastVoteDate = localStorage.getItem(STORAGE_KEY_VOTED);
                return lastVoteDate === getTodayString();
            }
            
            try {
                const userId = getUserIdentifier();
                const snapshot = await db.ref('votedUsers/' + userId).once('value');
                if (snapshot.exists()) {
                    const lastVoteDate = snapshot.val();
                    return lastVoteDate === getTodayString();
                }
                return false;
            } catch (error) {
                console.error('检查用户投票状态失败:', error);
                const lastVoteDate = localStorage.getItem(STORAGE_KEY_VOTED);
                return lastVoteDate === getTodayString();
            }
        }
        
        // 检查用户是否是首次投票
        async function isFirstTimeVoter() {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) {
                return !localStorage.getItem(STORAGE_KEY_VOTED + '_counted');
            }
            
            try {
                const userId = getUserIdentifier();
                const snapshot = await db.ref('firstTimeVoters/' + userId).once('value');
                return !snapshot.exists();
            } catch (error) {
                console.error('检查首次投票状态失败:', error);
                return !localStorage.getItem(STORAGE_KEY_VOTED + '_counted');
            }
        }

        // 打开视频链接
        function openVideoLink(contestant) {
            let videoUrl = contestant.video;
            if (videoUrl.includes('bilibili.com/video/')) {
                const bvid = videoUrl.match(/BV[A-Za-z0-9]+/) || videoUrl.match(/av\d+/);
                if (bvid) {
                    videoUrl = 'https://b23.tv/' + bvid[0];
                }
            }
            window.location.href = videoUrl;
        }

        function loadVotesFromStorage() {
            try {
                const savedVotes = localStorage.getItem(STORAGE_KEY_VOTES);
                if (savedVotes) {
                    const votesObj = JSON.parse(savedVotes);
                    contestants.forEach(c => {
                        c.votes = votesObj[c.id] || 0;
                    });
                }
            } catch (e) {
                console.error('加载投票数据失败:', e);
            }
        }

        function saveVotesToStorage() {
            try {
                const votesObj = {};
                contestants.forEach(c => {
                    votesObj[c.id] = c.votes;
                });
                localStorage.setItem(STORAGE_KEY_VOTES, JSON.stringify(votesObj));
            } catch (e) {
                console.error('保存投票数据失败:', e);
            }
        }

        function manualRefresh() {
            showMessage('info', '数据已刷新');
            updateResults();
            updateStats();
        }

        async function checkVoteStatus() {
            if (!isVoteStarted()) {
                document.getElementById('voteStatus').textContent = '投票尚未开始，请等待至5月12日21:00';
                document.getElementById('voteStatus').style.color = '#ff9800';
                document.getElementById('voteBtn').disabled = true;
                document.querySelectorAll('.contestant-card').forEach(card => {
                    card.classList.add('disabled');
                });
                return;
            }

            hasVotedToday = await checkUserVotedToday();
            
            if (hasVotedToday) {
                document.getElementById('voteStatus').textContent = '今日已投票，明天再来！';
                document.getElementById('voteStatus').style.color = '#c62828';
                document.getElementById('voteBtn').disabled = true;
                const votedIds = JSON.parse(localStorage.getItem(STORAGE_KEY_SELECTED) || '[]');
                selectedIds = votedIds;
                updateSelectedDisplay();
                highlightVotedContestants(votedIds);
            } else {
                document.getElementById('voteStatus').textContent = '每人每天可投3票，最多选择3位选手';
                document.getElementById('voteStatus').style.color = '#2d5a27';
            }
        }

        function renderContestants() {
            const container = document.getElementById('contestants');
            container.innerHTML = '';
            const voteNotStarted = !isVoteStarted();
            
            contestants.forEach(contestant => {
                const card = document.createElement('div');
                card.className = 'contestant-card';
                card.dataset.id = contestant.id;
                
                if (hasVotedToday || voteNotStarted) card.classList.add('disabled');
                
                card.innerHTML = `
                    <div class="contestant-avatar">${contestant.id}</div>
                    <div class="contestant-name">${contestant.name}</div>
                    <div class="contestant-song">${contestant.song || '待定'}</div>
                    <div class="contestant-number">选手 ${contestant.id} 号</div>
                    <div class="contestant-video-btn" data-id="${contestant.id}">▶ 观看视频</div>
                `;
                
                if (!hasVotedToday && !voteNotStarted) {
                    card.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('contestant-video-btn')) {
                            toggleContestant(contestant.id);
                        }
                    });
                }
                
                const videoBtn = card.querySelector('.contestant-video-btn');
                const handleVideoClick = (e) => {
                    e.stopPropagation();
                    openVideoLink(contestant);
                };
                videoBtn.addEventListener('click', handleVideoClick);
                videoBtn.addEventListener('touchstart', handleVideoClick);
                
                container.appendChild(card);
            });
        }

        function toggleContestant(id) {
            if (hasVotedToday || !isVoteStarted()) return;
            const index = selectedIds.indexOf(id);
            if (index > -1) {
                selectedIds.splice(index, 1);
            } else if (selectedIds.length < 3) {
                selectedIds.push(id);
            } else {
                showMessage('error', '最多只能选择3位选手！');
            }
            updateSelectedDisplay();
            updateCardStyles();
        }

        function updateSelectedDisplay() {
            document.getElementById('selectedCount').textContent = selectedIds.length;
            document.getElementById('voteBtn').disabled = selectedIds.length === 0 || hasVotedToday || !isVoteStarted();
        }

        function updateCardStyles() {
            document.querySelectorAll('.contestant-card').forEach(card => {
                const id = parseInt(card.dataset.id);
                card.classList.toggle('selected', selectedIds.includes(id));
            });
        }

        function highlightVotedContestants(votedIds) {
            document.querySelectorAll('.contestant-card').forEach(card => {
                const id = parseInt(card.dataset.id);
                if (votedIds.includes(id)) card.classList.add('selected');
            });
        }

        async function submitVote() {
            if (selectedIds.length === 0) {
                showMessage('error', '请先选择要投票的选手！');
                return;
            }
            
            const alreadyVoted = await checkUserVotedToday();
            if (alreadyVoted) {
                showMessage('error', '您今日已投票，请明天再来！');
                return;
            }
            
            localStorage.setItem(STORAGE_KEY_VOTED, getTodayString());
            localStorage.setItem(STORAGE_KEY_SELECTED, JSON.stringify(selectedIds));
            
            selectedIds.forEach(id => {
                const contestant = contestants.find(c => c.id === id);
                if (contestant) {
                    contestant.votes++;
                }
            });
            
            const isFirst = await isFirstTimeVoter();
            const hasCounted = localStorage.getItem(STORAGE_KEY_VOTED + '_counted');
            if (!hasCounted && isFirst) {
                localStorage.setItem(STORAGE_KEY_VOTED + '_counted', 'true');
                totalVoters++;
                localStorage.setItem(STORAGE_KEY_TOTAL_VOTERS, totalVoters.toString());
            }
            
            saveVotesToStorage();
            
            const increaseVoters = !hasCounted && isFirst;
            await saveVotesToCloud(selectedIds, increaseVoters);
            
            hasVotedToday = true;
            
            updateResults();
            updateStats();
            updateSelectedDisplay();
            highlightVotedContestants(selectedIds);
            
            document.querySelectorAll('.contestant-card').forEach(card => {
                card.classList.add('disabled');
            });
            
            document.getElementById('voteStatus').textContent = '今日已投票，明天再来！';
            document.getElementById('voteStatus').style.color = '#c62828';
            
            showMessage('success', '投票成功！感谢您的参与');
        }

        function updateResults() {
            const sorted = [...contestants].sort((a, b) => b.votes - a.votes);
            const list = document.getElementById('resultsList');
            list.innerHTML = '';
            
            sorted.forEach((contestant, index) => {
                const item = document.createElement('div');
                item.className = `result-item ${index < 3 ? 'top3' : ''}`;
                
                let rankClass = 'other';
                if (index === 0) rankClass = 'gold';
                else if (index === 1) rankClass = 'silver';
                else if (index === 2) rankClass = 'bronze';
                
                item.innerHTML = `
                    <div class="result-info">
                        <div class="result-rank ${rankClass}">${index + 1}</div>
                        <div class="result-name">${contestant.name}</div>
                    </div>
                    <div class="result-votes">${contestant.votes}票</div>
                `;
                
                list.appendChild(item);
            });
        }

        function updateStats() {
            const total = contestants.reduce((sum, c) => sum + c.votes, 0);
            document.getElementById('totalVotes').textContent = total;
            document.getElementById('totalVoters').textContent = totalVoters;
        }

        function showMessage(type, message) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = message;
            document.body.appendChild(msg);
            
            setTimeout(() => {
                msg.remove();
            }, 3000);
        }

        function updateRemainingTime() {
            const deadline = new Date('2026-05-17T18:00:00');
            const now = new Date();
            const diff = deadline - now;
            
            if (diff <= 0) {
                document.getElementById('remainingTime').textContent = '⏰ 投票已结束';
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('remainingTime').textContent = 
                `⏰ 距离投票截止还剩：${days}天 ${hours}小时 ${minutes}分钟 ${seconds}秒`;
        }

        async function init() {
            loadVotesFromStorage();
            await checkVoteStatus();
            renderContestants();
            updateResults();
            updateStats();
            updateRemainingTime();
            setInterval(updateRemainingTime, 1000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
