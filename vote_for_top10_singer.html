<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农学院十佳歌手十二强投票</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #00b894 0%, #55a05a 30%, #2d5a27 70%, #1e3a1e 100%);
            position: relative;
            overflow-x: hidden;
        }

        .bg-decoration {
            position: fixed;
            pointer-events: none;
            opacity: 0.15;
            z-index: 0;
        }

        .bg-leaf1 {
            top: 5%;
            left: -3%;
            font-size: 180px;
            animation: float 25s infinite ease-in-out;
        }

        .bg-leaf2 {
            bottom: 10%;
            right: -5%;
            font-size: 200px;
            animation: float 22s infinite ease-in-out 3s;
        }

        .bg-grass1 {
            top: 30%;
            left: 5%;
            font-size: 120px;
            animation: float 20s infinite ease-in-out 5s;
        }

        .bg-grass2 {
            bottom: 20%;
            right: 10%;
            font-size: 150px;
            animation: float 28s infinite ease-in-out 2s;
        }

        .bg-wheat {
            top: 60%;
            left: 15%;
            font-size: 130px;
            animation: float 24s infinite ease-in-out 4s;
        }

        .bg-sunflower {
            top: 15%;
            right: 15%;
            font-size: 160px;
            animation: float 26s infinite ease-in-out 6s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            50% { transform: translateY(10px) rotate(-3deg); }
            75% { transform: translateY(-15px) rotate(3deg); }
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: clamp(1rem, 3vw, 1.2rem);
            opacity: 0.95;
            margin-bottom: 15px;
        }

        .deadline {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        .rules {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .rules h3 {
            color: #2d5a27;
            margin-bottom: 12px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rules ul {
            list-style: none;
            padding-left: 20px;
        }

        .rules li {
            padding: 8px 0;
            color: #555;
            position: relative;
            font-size: 0.95rem;
        }

        .rules li::before {
            content: '🌾';
            position: absolute;
            left: -20px;
        }

        .poll-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .vote-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 18px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 10px;
        }

        .vote-count {
            color: #2d5a27;
            font-weight: bold;
            font-size: 1.5rem;
            display: block;
            margin-bottom: 8px;
        }

        .vote-status {
            color: #558b2f;
            font-size: 0.95rem;
            display: block;
        }

        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
        }

        .video-modal-content {
            position: relative;
            width: 90%;
            max-width: 640px;
            background: #1a3a1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .video-close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .video-close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .video-player-container {
            width: 100%;
            background: #000;
            position: relative;
            min-height: 300px;
        }

        .video-player-container video,
        .video-player-container iframe {
            width: 100%;
            max-height: 70vh;
            display: block;
        }

        .video-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #00b894;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .video-error {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            background: rgba(0, 0, 0, 0.9);
        }

        .retry-btn {
            margin-top: 15px;
            padding: 10px 25px;
            background: #00b894;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
        }

        .video-info {
            padding: 20px;
            text-align: center;
        }

        .video-info h3 {
            color: #fff;
            margin: 0 0 8px 0;
            font-size: 1.3rem;
        }

        .video-info p {
            color: #a8e6cf;
            margin: 0;
            font-size: 1rem;
        }

        .contestants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .contestant-card {
            background: linear-gradient(145deg, #f8faf8 0%, #e8f5e9 100%);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-align: center;
        }

        .contestant-card:hover:not(.disabled) {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,184,148,0.2);
            border-color: #00b894;
        }

        .contestant-card.selected {
            background: linear-gradient(145deg, #e8f5e9 0%, #c8e6c9 100%);
            border-color: #2d5a27;
        }

        .contestant-card.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .contestant-avatar {
            width: clamp(60px, 18vw, 75px);
            height: clamp(60px, 18vw, 75px);
            border-radius: 50%;
            background: linear-gradient(135deg, #00b894 0%, #2d5a27 100%);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            font-weight: bold;
        }

        .contestant-name {
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            font-weight: bold;
            color: #2d5a27;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contestant-song {
            font-size: clamp(0.75rem, 2.5vw, 0.85rem);
            color: #66bb6a;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contestant-number {
            display: inline-block;
            background: linear-gradient(135deg, #00b894 0%, #2d5a27 100%);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: clamp(0.7rem, 2vw, 0.8rem);
            font-weight: bold;
        }

        .contestant-video-btn {
            font-size: 0.8rem;
            color: #7bed9f;
            margin-top: 8px;
            padding: 8px 16px;
            background: rgba(123, 237, 159, 0.2);
            border-radius: 15px;
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(123, 237, 159, 0.3);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            min-width: 80px;
        }

        .contestant-video-btn:hover {
            background: rgba(123, 237, 159, 0.4);
            transform: scale(1.05);
        }

        .contestant-video-btn:active {
            transform: scale(0.95);
            background: rgba(123, 237, 159, 0.5);
        }

        .contestant-card.disabled .contestant-video-btn {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 600px) {
            .contestant-video-btn {
                font-size: clamp(0.75rem, 3.5vw, 0.9rem);
                padding: 10px 20px;
                min-width: 100px;
            }
        }

        .vote-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00b894 0%, #2d5a27 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0,184,148,0.3);
        }

        .vote-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,184,148,0.4);
        }

        .vote-btn:disabled {
            background: #a5d6a7;
            cursor: not-allowed;
        }

        .results {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e8f5e9;
        }

        .results h3 {
            font-size: 1.3rem;
            color: #2d5a27;
            margin-bottom: 18px;
            text-align: center;
        }

        .result-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 12px 15px;
            background: #f8faf8;
            border-radius: 10px;
        }

        .result-rank {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00b894 0%, #2d5a27 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            font-size: 0.9rem;
        }

        .result-rank.top3 {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
        }

        .result-info {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-name {
            font-weight: bold;
            color: #2d5a27;
            text-align: center;
        }

        .result-bar-container {
            flex: 2;
            margin-left: 15px;
        }

        .result-bar {
            height: 22px;
            background: #e8f5e9;
            border-radius: 11px;
            overflow: hidden;
        }

        .result-fill {
            height: 100%;
            background: linear-gradient(90deg, #00b894 0%, #2d5a27 100%);
            border-radius: 11px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }

        .result-fill span {
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #f8faf8 0%, #e8f5e9 100%);
            border-radius: 12px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2d5a27;
        }

        .stat-label {
            font-size: 0.95rem;
            color: #558b2f;
            margin-top: 5px;
        }

        .sync-status {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            font-size: 0.85rem;
            color: #666;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .message.info {
            background: #cce5ff;
            color: #004085;
        }

        .remaining-time {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 1rem;
            opacity: 0.95;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        @media (max-width: 600px) {
            .contestants-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }

            .contestant-card {
                padding: 15px 10px;
            }

            .contestant-name {
                font-size: clamp(0.85rem, 4vw, 1rem);
                min-height: 1.4em;
            }

            .contestant-song {
                font-size: clamp(0.7rem, 3vw, 0.8rem);
                min-height: 1.4em;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }

            .result-item {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .result-bar-container {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="bg-decoration bg-leaf1">🍃</div>
    <div class="bg-decoration bg-leaf2">🌿</div>
    <div class="bg-decoration bg-grass1">🌱</div>
    <div class="bg-decoration bg-grass2">☘️</div>
    <div class="bg-decoration bg-wheat">🌾</div>
    <div class="bg-decoration bg-sunflower">🌻</div>

    <div class="container">
        <div class="header">
            <h1>🌾 农学院十佳歌手 🌾</h1>
            <p>初赛18进12投票通道</p>
            <div class="deadline">投票时间：2026年5月12日21:00 - 5月17日18:00</div>
        </div>

        <div class="rules">
            <h3>📋 投票规则</h3>
            <ul>
                <li>每天可投最多 <strong>三票</strong></li>
                <li>每天只能投票 <strong>一次</strong></li>
            </ul>
        </div>

        <div class="poll-card">
            <div class="vote-info">
                <span class="vote-count" id="selectedCount">0</span> / 3 票已选择
                <span class="vote-status" id="voteStatus">今日剩余投票机会：1次</span>
            </div>

            <!-- 视频弹窗 -->
            <div class="video-modal" id="videoModal" style="display: none;">
                <div class="video-modal-overlay" onclick="closeVideoModal(event)"></div>
                <div class="video-modal-content">
                    <button class="video-close-btn" onclick="closeVideoModal()">×</button>
                    <div class="video-player-container">
                        <div id="videoLoading" class="video-loading">
                            <div class="loading-spinner"></div>
                            <p>正在加载视频...</p>
                        </div>
                        <!-- B站视频 iframe -->
                        <iframe id="bilibiliFrame" src="" frameborder="0" allowfullscreen style="display: none; width: 100%; height: 400px;"></iframe>
                        <!-- 普通视频 -->
                        <video id="player" controls poster="" playsinline webkit-playsinline x-webkit-airplay="allow" x5-video-player-type="h5" style="display: none;">
                            <source id="videoSource" src="" type="video/mp4">
                            <source id="videoSourceWebm" src="" type="video/webm">
                        </video>
                        <div id="videoError" class="video-error" style="display: none;">
                            <p>😔 视频加载失败</p>
                            <p>请检查网络连接或稍后重试</p>
                            <button class="retry-btn" onclick="retryVideo()">重试</button>
                        </div>
                    </div>
                    <div class="video-info">
                        <h3 id="videoContestantName"></h3>
                        <p id="videoSongName"></p>
                    </div>
                </div>
            </div>

            <div class="contestants-grid" id="contestants"></div>

            <button class="vote-btn" id="voteBtn" onclick="submitVote()">提交投票</button>

            <div class="results">
                <h3>📊 实时投票排名</h3>
                <div id="resultsList"></div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalVotes">0</div>
                    <div class="stat-label">总票数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalVoters">0</div>
                    <div class="stat-label">参与人数</div>
                </div>
            </div>

            <div style="text-align:center;margin-top:15px;">
                <button onclick="manualRefresh()" style="padding:8px 16px;background:#2196F3;color:white;border:none;border-radius:4px;cursor:pointer;">
                    🔄 手动刷新数据
                </button>
            </div>

            <div class="sync-status" id="syncStatus">
                <span id="syncIcon">🔄</span> <span id="syncText">本地模式</span>
            </div>
        </div>

        <div class="remaining-time" id="remainingTime"></div>
    </div>

    <script>
        const ENABLE_CLOUD_SYNC = true;  // 启用云端同步，确保数据共享
        let db = null;
        let firebaseInitialized = false;
        let currentContestant = null;

        // 加载 Firebase SDK
        if (ENABLE_CLOUD_SYNC) {
            const script1 = document.createElement('script');
            script1.src = 'https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js';
            script1.onload = loadFirebaseDatabase;
            script1.onerror = () => {
                console.error('Firebase SDK 加载失败');
            };
            document.head.appendChild(script1);
        }

        function loadFirebaseDatabase() {
            const script2 = document.createElement('script');
            script2.src = 'https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js';
            script2.onload = initFirebase;
            script2.onerror = () => {
                console.error('Firebase Database SDK 加载失败');
            };
            document.head.appendChild(script2);
        }

        function initFirebase() {
            const firebaseConfig = {
                apiKey: "AIzaSyDKwD96gPVTZKAEyD_yJXRWVggNMpTWVF8",
                authDomain: "vote-for-candidates.firebaseapp.com",
                databaseURL: "https://vote-for-candidates-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "vote-for-candidates",
                storageBucket: "vote-for-candidates.firebasestorage.app",
                messagingSenderId: "600898694792",
                appId: "1:600898694792:web:ce385f05086bccc527b93d"
            };
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
                firebaseInitialized = true;
                console.log('Firebase 初始化成功');
                updateSyncStatus(true, '云端连接成功');
                loadVotesFromCloud();
                setupFirebaseListeners();
            } catch (error) {
                console.error('Firebase 初始化失败:', error);
                updateSyncStatus(false, '数据同步服务初始化失败');
            }
        }

        function updateSyncStatus(isOnline, text) {
            const statusEl = document.getElementById('syncStatus');
            const iconEl = document.getElementById('syncIcon');
            const textEl = document.getElementById('syncText');
            if (!statusEl) return;
            iconEl.textContent = isOnline ? '✅' : '⚠️';
            textEl.textContent = text;
        }

        function setupFirebaseListeners() {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) return;
            try {
                db.ref('votes').on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        contestants.forEach(c => {
                            c.votes = data[c.id] || 0;
                        });
                        updateResults();
                        updateStats();
                    }
                });
                db.ref('totalVoters').on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        totalVoters = snapshot.val();
                        updateStats();
                    }
                });
            } catch (error) {
                console.error('设置监听器失败:', error);
            }
        }

        async function loadVotesFromCloud() {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) return;
            try {
                const snapshot = await db.ref('votes').once('value');
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    contestants.forEach(c => {
                        c.votes = data[c.id] || 0;
                    });
                }
                const votersSnapshot = await db.ref('totalVoters').once('value');
                totalVoters = votersSnapshot.exists() ? votersSnapshot.val() : 0;
                updateResults();
                updateStats();
            } catch (error) {
                console.error('加载云端数据失败:', error);
            }
        }

        async function saveVotesToCloud(votedIds, increaseVoters) {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) return;
            try {
                for (const id of votedIds) {
                    await db.ref('votes/' + id).transaction(currentVotes => {
                        return (currentVotes || 0) + 1;
                    });
                }
                if (increaseVoters) {
                    await db.ref('totalVoters').transaction(currentVoters => {
                        return (currentVoters || 0) + 1;
                    });
                }
                // 记录用户投票状态，防止重复投票
                const userId = getUserIdentifier();
                await db.ref('votedUsers/' + userId).set(getTodayString());
                console.log('投票保存到云端成功');
            } catch (error) {
                console.error('保存到云端失败:', error);
            }
        }

        const contestants = [
            // 示例：使用B站链接，你需要替换为实际上传后的B站视频链接
            { id: 1, name: '陈香凝', song: '《喜欢你》', votes: 0, video: 'https://b23.tv/oCGEFzr' },
            { id: 2, name: '宋靖宇', song: '《第一天》', votes: 0, video: 'https://b23.tv/Hjcnye7' },

            { id: 6, name: '周琳涵', song: '《City of Stars》', votes: 0, video: 'https://b23.tv/csGekEu' },
            { id: 7, name: '鲍星池', song: '《人间共鸣》', votes: 0, video: 'https://b23.tv/e4AoCIG' },
            { id: 8, name: '刘浩杰', song: '《萱草花》', votes: 0, video: 'https://b23.tv/AFuhV7u' },
            { id: 9, name: '张园彬', song: '《青火》', votes: 0, video: 'https://b23.tv/KCrgC75' },
            { id: 10, name: '胡云帆', song: '《单车》', votes: 0, video: 'https://b23.tv/yLcyWG0' },
            { id: 11, name: '王玉琛', song: '《年少有为》', votes: 0, video: 'https://b23.tv/kMspSuJ' },
            { id: 12, name: '李沛远', song: '《斑马斑马》', votes: 0, video: 'https://b23.tv/RyZZFUf' },
            { id: 13, name: '单自翔', song: '《杀死那个石家庄人》', votes: 0, video: 'https://b23.tv/nwzKWHJ' },

            { id: 15, name: '操越', song: '《不为谁而作的歌》', votes: 0, video: 'https://b23.tv/HuC3bFt' },

            { id: 18, name: '项俊豪', song: '《想见你想见你想见你》', votes: 0, video: 'https://b23.tv/WclnjVh' }
        ];

        const VOTE_START_TIME = new Date('2026-05-12T21:00:00').getTime();
        const STORAGE_KEY_VOTED = 'singer_vote_date';
        const STORAGE_KEY_SELECTED = 'singer_vote_selected';
        const STORAGE_KEY_TOTAL_VOTERS = 'singer_total_voters';
        const STORAGE_KEY_VOTES = 'singer_votes';

        let selectedIds = [];
        let hasVotedToday = false;
        let totalVoters = parseInt(localStorage.getItem(STORAGE_KEY_TOTAL_VOTERS)) || 0;

        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        function isVoteStarted() {
            try {
                return Date.now() >= VOTE_START_TIME;
            } catch (e) {
                return new Date() >= new Date('2026-05-12T12:00:00');
            }
        }

        // 生成稳定的浏览器指纹标识
        function getUserIdentifier() {
            // 优先从localStorage获取
            let userId = localStorage.getItem('singer_vote_user_id');
            if (userId) {
                return userId;
            }
            
            // 生成浏览器指纹（基于浏览器特征，清空缓存后仍保持稳定）
            const fingerprint = generateBrowserFingerprint();
            
            // 存储到localStorage方便后续使用
            localStorage.setItem('singer_vote_user_id', fingerprint);
            return fingerprint;
        }
        
        // 生成浏览器指纹
        function generateBrowserFingerprint() {
            const components = [
                navigator.userAgent,
                navigator.language,
                navigator.platform,
                screen.width + 'x' + screen.height,
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || 'unknown',
                navigator.maxTouchPoints || '0'
            ];
            
            // 简单的哈希算法
            let hash = 0;
            const str = components.join('|');
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32bit integer
            }
            
            return 'fingerprint_' + Math.abs(hash).toString(36);
        }

        // 检查用户今天是否已在云端投票
        async function checkUserVotedToday() {
            if (!ENABLE_CLOUD_SYNC || !db || !firebaseInitialized) {
                // 如果没有云端同步，使用本地检查
                const lastVoteDate = localStorage.getItem(STORAGE_KEY_VOTED);
                return lastVoteDate === getTodayString();
            }
            
            try {
                const userId = getUserIdentifier();
                const snapshot = await db.ref('votedUsers/' + userId).once('value');
                if (snapshot.exists()) {
                    const lastVoteDate = snapshot.val();
                    return lastVoteDate === getTodayString();
                }
                return false;
            } catch (error) {
                console.error('检查用户投票状态失败:', error);
                // 降级到本地检查
                const lastVoteDate = localStorage.getItem(STORAGE_KEY_VOTED);
                return lastVoteDate === getTodayString();
            }
        }

        // 打开视频链接
        function openVideoLink(contestant) {
            // 处理B站链接，转换为移动端适配格式
            let videoUrl = contestant.video;
            if (videoUrl.includes('bilibili.com/video/')) {
                // 转换为移动端适配的短链接
                const bvid = videoUrl.match(/BV[A-Za-z0-9]+/) || videoUrl.match(/av\d+/);
                if (bvid) {
                    videoUrl = 'https://b23.tv/' + bvid[0];
                }
            }
            // 直接跳转
            window.location.href = videoUrl;
        }

        function loadVotesFromStorage() {
            try {
                const savedVotes = localStorage.getItem(STORAGE_KEY_VOTES);
                if (savedVotes) {
                    const votesObj = JSON.parse(savedVotes);
                    contestants.forEach(c => {
                        c.votes = votesObj[c.id] || 0;
                    });
                }
            } catch (e) {
                console.error('加载投票数据失败:', e);
            }
        }

        function saveVotesToStorage() {
            try {
                const votesObj = {};
                contestants.forEach(c => {
                    votesObj[c.id] = c.votes;
                });
                localStorage.setItem(STORAGE_KEY_VOTES, JSON.stringify(votesObj));
            } catch (e) {
                console.error('保存投票数据失败:', e);
            }
        }

        function manualRefresh() {
            showMessage('info', '数据已刷新');
            updateResults();
            updateStats();
        }

        async function checkVoteStatus() {
            if (!isVoteStarted()) {
                document.getElementById('voteStatus').textContent = '投票尚未开始，请等待至5月12日21:00';
                document.getElementById('voteStatus').style.color = '#ff9800';
                document.getElementById('voteBtn').disabled = true;
                document.querySelectorAll('.contestant-card').forEach(card => {
                    card.classList.add('disabled');
                });
                return;
            }

            // 优先检查云端投票状态
            hasVotedToday = await checkUserVotedToday();
            
            if (hasVotedToday) {
                document.getElementById('voteStatus').textContent = '今日已投票，明天再来！';
                document.getElementById('voteStatus').style.color = '#c62828';
                document.getElementById('voteBtn').disabled = true;
                const votedIds = JSON.parse(localStorage.getItem(STORAGE_KEY_SELECTED) || '[]');
                selectedIds = votedIds;
                updateSelectedDisplay();
                highlightVotedContestants(votedIds);
            }
        }

        function renderContestants() {
            const container = document.getElementById('contestants');
            container.innerHTML = '';
            const voteNotStarted = !isVoteStarted();
            
            contestants.forEach(contestant => {
                const card = document.createElement('div');
                card.className = 'contestant-card';
                card.dataset.id = contestant.id;
                
                if (hasVotedToday || voteNotStarted) card.classList.add('disabled');
                
                card.innerHTML = `
                    <div class="contestant-avatar">${contestant.id}</div>
                    <div class="contestant-name">${contestant.name}</div>
                    <div class="contestant-song">${contestant.song || '待定'}</div>
                    <div class="contestant-number">选手 ${contestant.id} 号</div>
                    <div class="contestant-video-btn" data-id="${contestant.id}">▶ 观看视频</div>
                `;
                
                if (!hasVotedToday && !voteNotStarted) {
                    card.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('contestant-video-btn')) {
                            toggleContestant(contestant.id);
                        }
                    });
                }
                
                const videoBtn = card.querySelector('.contestant-video-btn');
                const handleVideoClick = (e) => {
                    e.stopPropagation();
                    openVideoLink(contestant);
                };
                videoBtn.addEventListener('click', handleVideoClick);
                videoBtn.addEventListener('touchstart', handleVideoClick);
                
                container.appendChild(card);
            });
        }

        function toggleContestant(id) {
            if (hasVotedToday || !isVoteStarted()) return;
            const index = selectedIds.indexOf(id);
            if (index > -1) {
                selectedIds.splice(index, 1);
            } else if (selectedIds.length < 3) {
                selectedIds.push(id);
            } else {
                showMessage('error', '最多只能选择3位选手！');
            }
            updateSelectedDisplay();
            updateCardStyles();
        }

        function updateSelectedDisplay() {
            document.getElementById('selectedCount').textContent = selectedIds.length;
            document.getElementById('voteBtn').disabled = selectedIds.length === 0 || hasVotedToday || !isVoteStarted();
        }

        function updateCardStyles() {
            document.querySelectorAll('.contestant-card').forEach(card => {
                const id = parseInt(card.dataset.id);
                card.classList.toggle('selected', selectedIds.includes(id));
            });
        }

        function highlightVotedContestants(votedIds) {
            document.querySelectorAll('.contestant-card').forEach(card => {
                const id = parseInt(card.dataset.id);
                if (votedIds.includes(id)) card.classList.add('selected');
            });
        }

        async function submitVote() {
            if (selectedIds.length === 0) {
                showMessage('error', '请先选择要投票的选手！');
                return;
            }
            
            // 再次检查云端投票状态，防止绕过前端限制
            const alreadyVoted = await checkUserVotedToday();
            if (alreadyVoted) {
                showMessage('error', '您今日已投票，请明天再来！');
                return;
            }
            
            localStorage.setItem(STORAGE_KEY_VOTED, getTodayString());
            localStorage.setItem(STORAGE_KEY_SELECTED, JSON.stringify(selectedIds));
            
            // 更新票数
            selectedIds.forEach(id => {
                const contestant = contestants.find(c => c.id === id);
                if (contestant) {
                    contestant.votes++;
                }
            });
            
            // 更新参与人数
            const hasCounted = localStorage.getItem(STORAGE_KEY_VOTED + '_counted');
            if (!hasCounted) {
                totalVoters++;
                localStorage.setItem(STORAGE_KEY_VOTED + '_counted', 'true');
                localStorage.setItem(STORAGE_KEY_TOTAL_VOTERS, totalVoters.toString());
            }
            
            // 保存到本地存储
            saveVotesToStorage();
            
            // 保存到云端（包含用户投票记录）
            const increaseVoters = !localStorage.getItem(STORAGE_KEY_VOTED + '_counted');
            await saveVotesToCloud(selectedIds, increaseVoters);
            
            hasVotedToday = true;
            document.getElementById('voteStatus').textContent = '今日已投票，明天再来！';
            document.getElementById('voteStatus').style.color = '#c62828';
            document.getElementById('voteBtn').disabled = true;
            
            updateResults();
            updateStats();
            showMessage('success', `投票成功！您已为 ${selectedIds.length} 位选手投票`);
        }

        function updateResults() {
            const sorted = [...contestants].sort((a, b) => b.votes - a.votes);
            const container = document.getElementById('resultsList');
            container.innerHTML = '';
            
            const totalVotes = contestants.reduce((sum, c) => sum + c.votes, 0);
            
            sorted.forEach((contestant, index) => {
                const percent = totalVotes > 0 ? Math.round((contestant.votes / totalVotes) * 100) : 0;
                
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <div class="result-rank ${index < 3 ? 'top3' : ''}">${index + 1}</div>
                    <div class="result-info">
                        <div class="result-name">${contestant.name}</div>
                    </div>
                    <div class="result-bar-container">
                        <div class="result-bar">
                            <div class="result-fill" style="width: ${percent}%">
                                <span>${contestant.votes}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function updateStats() {
            const totalVotes = contestants.reduce((sum, c) => sum + c.votes, 0);
            document.getElementById('totalVotes').textContent = totalVotes;
            document.getElementById('totalVoters').textContent = totalVoters;
        }

        function showMessage(type, text) {
            const existing = document.querySelector('.message');
            if (existing) existing.remove();
            
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            
            const pollCard = document.querySelector('.poll-card');
            pollCard.insertBefore(message, pollCard.firstChild);
            
            setTimeout(() => message.remove(), 3000);
        }

        function updateRemainingTime() {
            const deadline = new Date('2026-05-17T18:00:00');
            const now = new Date();
            const diff = deadline - now;
            
            if (diff <= 0) {
                document.getElementById('remainingTime').textContent = '投票已截止';
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('remainingTime').textContent = 
                `⏰ 距离投票截止还剩：${days}天 ${hours}小时 ${minutes}分钟 ${seconds}秒`;
        }

        async function init() {
            loadVotesFromStorage();
            await checkVoteStatus();
            renderContestants();
            updateResults();
            updateStats();
            updateRemainingTime();
            setInterval(updateRemainingTime, 1000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
